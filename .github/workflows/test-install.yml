name: End-to-End Install Test (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-install:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Node and npm versions
        run: |
          node --version
          npm --version

      - name: Create representative-subset user-config (Python + kubectl + GitHub MCP; Docker Desktop excluded, needs nested virtualization unavailable on hosted runners)
        shell: pwsh
        run: |
          $config = @{
            tools = @{ java=$false; python=$true; nodejs=$false; csharp=$false; go=$false; rust=$false; cpp=$false }
            containers = @{ docker=$false; kubernetes=$true }
            cloud = @{ aws=$false; gcp=$false; azure=$false }
            mcps = @{ github=$true; postgresql=$false; docker=$false; figma=$false; playwright=$false; sentry=$false; chrome=$false }
            extras = @{ postman=$false; httpie=$false; dbeaver=$false; mongosh=$false; terraform=$false; helm=$false; k9s=$false; minikube=$false; ngrok=$false; mkcert=$false; direnv=$false; neovim=$false; starship=$false }
          }
          if (-not (Test-Path state)) { New-Item -ItemType Directory -Path state | Out-Null }
          $config | ConvertTo-Json | Out-File state/user-config.json -Encoding UTF8
          Write-Host "user-config.json written"

      - name: Phase 1 - Machine Detection (pre-install baseline)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/phases/phase-1-detect.ps1

      - name: "Phase 2 - Tool Installation (real install of 15 core tools + Python + kubectl)"
        shell: pwsh
        run: |
          echo "" | powershell -ExecutionPolicy Bypass -File scripts/phases/phase-2-install.ps1 -IncludeCoreInCI

      - name: Verify representative tools actually installed
        shell: pwsh
        run: |
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          $checks = @("git", "gh", "rg", "fzf", "bat", "jq", "delta", "lazygit", "curl", "wget", "python", "kubectl")
          $missing = @()
          foreach ($cmd in $checks) {
            if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) { $missing += $cmd }
          }
          if ($missing.Count -gt 0) { throw "FAIL: these tools are not on PATH after install: $($missing -join ', ')" }
          Write-Host "PASS: all $($checks.Count) representative tools installed and on PATH"

      - name: Phase 3 - Environment Configuration
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/phases/phase-3-config.ps1

      - name: Phase 4 - MCP Setup (GitHub MCP only, no token)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/phases/phase-4-mcp.ps1
        # CI mode auto-detected via $env:GITHUB_ACTIONS - all Read-Host prompts skipped

      - name: Verify Gemini CLI config was written
        shell: pwsh
        run: |
          $path = "$env:USERPROFILE\.gemini\settings.json"
          if (-not (Test-Path $path)) { throw "FAIL: Gemini CLI settings.json not found at $path" }
          $content = Get-Content $path | ConvertFrom-Json
          if (-not $content.mcpServers) { throw "FAIL: mcpServers key missing in settings.json" }
          if (-not $content.mcpServers.github) { throw "FAIL: github MCP not found in settings.json" }
          Write-Host "PASS: Gemini CLI settings.json contains github MCP"
          $content | ConvertTo-Json -Depth 5

      - name: Verify Cline config was written
        shell: pwsh
        run: |
          $path = "$env:USERPROFILE\.config\cline\cline_mcp_config.json"
          if (-not (Test-Path $path)) { throw "FAIL: Cline config not found at $path" }
          Write-Host "PASS: Cline config exists"

      - name: Verify Codex config.toml was written
        shell: pwsh
        run: |
          $path = "$env:USERPROFILE\.codex\config.toml"
          if (-not (Test-Path $path)) { throw "FAIL: Codex config.toml not found at $path" }
          $content = Get-Content $path -Raw
          if ($content -notmatch "\[mcp_servers.github\]") { throw "FAIL: github not found in config.toml" }
          Write-Host "PASS: Codex config.toml contains github MCP"
          Write-Host $content

      - name: Phase 4b - MCP Validation
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/phases/phase-4b-validate.ps1

      - name: Verify validation results saved
        shell: pwsh
        run: |
          $path = "state/mcp-validation.json"
          if (-not (Test-Path $path)) { throw "FAIL: mcp-validation.json not found" }
          $v = Get-Content $path | ConvertFrom-Json
          Write-Host "PASS: Validation results:"
          Write-Host "  Passed : $($v.passed)"
          Write-Host "  Skipped: $($v.skipped)"
          Write-Host "  Failed : $($v.failed)"

      - name: Phase 5 - mcp-router install
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/phases/phase-5-mcp-router.ps1

      - name: Verify mcp-router scoring end-to-end (real stdio MCP call)
        shell: pwsh
        run: |
          $routerPath = "$env:USERPROFILE\.local\lib\mcp-servers\mcp-router\src\router.js"
          if (-not (Test-Path $routerPath)) { throw "FAIL: router.js not found at $routerPath" }
          $env:MCP_ROUTER_CONFIG = "$env:USERPROFILE\.config\magnus\mcp-manifest.json"
          $env:ROUTER_PATH = $routerPath
          $script = @'
          import { pathToFileURL } from "url";
          const routerUrl = pathToFileURL(process.env.ROUTER_PATH).href;
          const { recommendMcp } = await import(routerUrl);
          const result = await recommendMcp("search github repos and code");
          console.log(result);
          if (!result.includes("GitHub")) { throw new Error("unexpected recommendation: " + result); }
          '@
          $script | Out-File "$env:RUNNER_TEMP\router-smoke.mjs" -Encoding UTF8
          node "$env:RUNNER_TEMP\router-smoke.mjs"
          if ($LASTEXITCODE -ne 0) { throw "FAIL: mcp-router recommend_mcp smoke test failed" }
          Write-Host "PASS: mcp-router recommended GitHub MCP for a GitHub-flavored task"

      - name: Phase 6 - Onboarding Report
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/phases/phase-6-report.ps1

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magnus-install-results
          path: |
            state/mcp-validation.json
            state/installation-state.json
            state/user-config.json
